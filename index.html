<script>'use strict';

const LESSONS = [
  {id:'object',course:'刑法',title:'犯罪客体',ru:'Объе́кт преступле́ния',minutes:12,summary:'犯罪侵害了什么受到刑法保护的社会关系？',explain:'犯罪客体是犯罪行为所侵害的、受到刑法保护的社会关系。不要把犯罪客体等同于具体物品或受害人。',example:'甲偷走乙的手机：手机是具体物品，乙是受害人，受到侵害的是财产关系。',russian:'Объе́кт преступле́ния — э́то обще́ственные отноше́ния, охраня́емые уголо́вным зако́ном.',remember:'客体＝被侵害的社会关系；物品＝предме́т；受害人＝потерпе́вший。',question:'甲偷走乙的自行车。自行车本身是犯罪客体吗？',answer:'不是。自行车属于具体物品；犯罪客体需要从受到刑法保护的社会关系来理解。'},
  {id:'objective',course:'刑法',title:'犯罪客观方面',ru:'Объекти́вная сторона́',minutes:15,summary:'行为、后果、因果关系分别是什么？',explain:'犯罪客观方面指犯罪的外部表现。危害行为是核心；危害结果及因果关系是否为必要特征，取决于具体犯罪构成。',example:'甲故意砸碎窗户：砸窗户是行为，窗户破碎是结果，“由甲砸碎”是因果关系。这个假设不直接决定具体罪名。',russian:'Объекти́вная сторона́ — э́то вне́шнее проявле́ние преступле́ния.',remember:'行为（дея́ние）→后果（после́дствие）→因果关系（причи́нная свя́зь）。',question:'所有犯罪都必须造成具体损害结果才能构成既遂吗？',answer:'不是。要区分不同构成类型；有些犯罪的既遂不以发生具体损害后果为必要条件。'},
  {id:'subject',course:'刑法',title:'犯罪主体',ru:'Субъе́кт преступле́ния',minutes:12,summary:'谁能承担刑事责任？',explain:'在俄罗斯刑法的一般规则下，犯罪主体必须是达到法定刑事责任年龄、具有刑事责任能力的自然人。某些罪名还要求特殊身份。',example:'某个罪名要求行为人具有特定职务身份时，必须确认是否具备该身份，不能只看行为。',russian:'Субъе́кт преступле́ния — э́то физи́ческое лицо́, дости́гшее во́зраста уголо́вной отве́тственности и вменя́емое.',remember:'自然人＋达到责任年龄＋责任能力；特殊主体要看具体罪名。',question:'公司能直接成为俄罗斯刑法中的犯罪主体吗？',answer:'俄罗斯刑法一般以自然人为犯罪主体；不要与法人可能承担的其他法律责任混为一谈。'},
  {id:'subjective',course:'刑法',title:'犯罪主观方面',ru:'Субъекти́вная сторона́',minutes:13,summary:'行为人内心的罪过是什么？',explain:'犯罪主观方面主要反映行为人对行为及相关后果的心理态度。罪过（故意或过失）是核心；动机、目的在某些构成中具有特定意义。',example:'甲明知会发生危险结果而希望它发生，与甲应当预见但没有预见，在主观态度上不同。',russian:'Субъекти́вная сторона́ включа́ет вину́, а в ря́де слу́чаев — моти́в и це́ль.',remember:'罪过＝вина́；故意＝умы́сел；过失＝неосто́рожность；动机＝моти́в；目的＝це́ль。',question:'“故意”和“过失”属于客观方面还是主观方面？',answer:'属于主观方面，它们描述行为人对行为及其后果的心理态度。'},
  {id:'four',course:'刑法',title:'犯罪构成四要素总复盘',ru:'Соста́в преступле́ния',minutes:18,summary:'把四个要素放进同一个案例分析。',explain:'四个要素是犯罪客体、犯罪客观方面、犯罪主体、犯罪主观方面。分析具体罪名时，还要以对应法律条文规定的构成特征为依据。',example:'以“甲故意拿走乙的手机”为练习情境：分别思考受侵害的关系、外部行为、行为人是否满足主体条件、行为人的心理态度。仅凭这句话还不能完成具体罪名的法律定性。',russian:'Объе́кт; объекти́вная сторона́; субъе́кт; субъекти́вная сторона́.',remember:'客体看“侵害什么”；客观方面看“做了什么”；主体看“谁能负责”；主观方面看“怎么想”。',question:'分析行为人的心理态度时，应该放在哪个要素？',answer:'主观方面。四要素在分析时应当分别确认，不能把客体和行为混成一项。'}
];

 case'toggle-lesson':{if(db.lessonsDone.includes(id)){db.lessonsDone=db.lessonsDone.filter(x=>x!==id);}else{db.lessonsDone.push(id);markStudied();}saveDB();render(true);break;}
 case'add-note':openNote();break;case'edit-note':openNote(id);break;
 case'delete-note':if(confirm('确定删除这条课堂笔记吗？')){db.courseNotes=db.courseNotes.filter(x=>x.id!==id);saveDB();closeModal();render(true);}break;
 case'word-group':state.wordGroup=btn.dataset.group;rebuildCards();render(true);break;
 case'card-direction':state.cardDirection=btn.dataset.direction;state.cardRevealed=false;render(true);break;
 case'flip-card':state.cardRevealed=!state.cardRevealed;render(true);break;
 case'rate-card':rateCard(btn.dataset.rating);break;
 case'reset-deck':rebuildCards(true);render(true);break;
 case'toggle-myday':state.showMyDay=!state.showMyDay;render(true);break;
 case'add-word':openWord();break;case'edit-word':openWord(id);break;
 case'delete-word':if(confirm('确定删除这个自定义词汇吗？')){db.customVocab=db.customVocab.filter(x=>x.id!==id);delete db.vocabProgress[id];saveDB();closeModal();rebuildCards();render(true);}break;
 case'tasks-filter':state.tasksTab=btn.dataset.filter;render(true);break;
 case'timer-select':state.timerMin=Number(btn.dataset.min);state.timerSeconds=state.timerMin*60;state.timerRunning=false;state.timerEnd=null;render(true);break;
 case'timer-toggle':beginTimer();break;
 case'timer-reset':state.timerRunning=false;state.timerEnd=null;state.timerSeconds=state.timerMin*60;render(true);toast('计时已重置');break;
 case'select-day':state.daySelect=Number(btn.dataset.day);render(true);break;
 case'add-schedule':openSchedule();break;case'edit-schedule':openSchedule(id);break;
 case'delete-schedule':if(confirm('确定删除这个每周课程吗？')){db.schedule=db.schedule.filter(x=>x.id!==id);saveDB();closeModal();render(true);}break;
 case'edit-goal':{const value=prompt('你希望每天专注多少分钟？（10—300）',String(db.focusGoal));if(value===null)return;const n=Number(value);if(!Number.isInteger(n)||n<10||n>300){toast('请输入10到300之间的整数');return;}db.focusGoal=n;saveDB();render(true);break;}
 case'export-data':exportData();break;
 case'import-data':document.getElementById('importInput').click();break;
 case'clear-data':if(confirm('将清空所有本地记录和自定义内容。确认继续？')&&confirm('最后确认：这项操作无法撤销，建议先导出备份。')){db=freshDB();state.cardQueue=[];saveDB();render();toast('已重置本机学习数据');}break;
 case'close-modal':closeModal();break;
 default:break;
}}
function exportData(){const data={app:'法途 Study',exportedAt:new Date().toISOString(),data:db};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`fatu-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已生成备份文件');}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(reader.result);const loaded=value.data||value;if(!Array.isArray(loaded.tasks)||!Array.isArray(loaded.schedule)||!Array.isArray(loaded.lessonsDone)||typeof loaded.vocabProgress!=='object'||loaded.vocabProgress===null)throw Error('备份格式不正确');if(!confirm('确认用备份内容替换当前的学习记录吗？'))return;db={...freshDB(),...loaded};state.cardQueue=[];saveDB();render();toast('备份已导入');}catch(e){toast('导入失败：JSON 文件格式不正确');}finally{document.getElementById('importInput').value='';}};reader.readAsText(file,'utf-8');}
function onSubmit(e){const form=e.target;if(!['taskForm','noteForm','scheduleForm','wordForm'].includes(form.id))return;e.preventDefault();const f=new FormData(form);let id=f.get('id')||uuid();const text=s=>String(f.get(s)||'').trim();if(form.id==='taskForm'){const t={id,title:text('title'),note:text('note'),date:text('date'),type:text('type'),minutes:10,done:false};if(!t.title||!t.date)return;const previous=db.tasks.find(x=>x.id===id);if(previous)t.done=previous.done;db.tasks=previous?db.tasks.map(x=>x.id===id?t:x):[...db.tasks,t];toast('任务已保存');}
else if(form.id==='noteForm'){const v={id,title:text('title'),body:text('body'),course:text('course')};if(!v.title||!v.body)return;db.courseNotes=db.courseNotes.some(x=>x.id===id)?db.courseNotes.map(x=>x.id===id?v:x):[...db.courseNotes,v];toast('课堂笔记已保存');}
else if(form.id==='scheduleForm'){const v={id,title:text('title'),day:Number(text('day')),time:text('time'),end:text('end'),type:text('type')};if(!v.title||!v.time||!v.end)return;if(v.end<=v.time){toast('结束时间应晚于开始时间');return;}db.schedule=db.schedule.some(x=>x.id===id)?db.schedule.map(x=>x.id===id?v:x):[...db.schedule,v];toast('每周课程已保存');}
else if(form.id==='wordForm'){const v={id,ru:text('ru'),zh:text('zh'),group:text('group'),custom:true};if(!v.ru||!v.zh)return;db.customVocab=db.customVocab.some(x=>x.id===id)?db.customVocab.map(x=>x.id===id?v:x):[...db.customVocab,v];state.cardQueue=[];toast('词汇已添加');}
saveDB();closeModal();render(true);}
document.addEventListener('click',e=>{const hit=e.target.closest('[data-action]');if(hit)clickAction(hit.dataset.action,hit);if(e.target.id==='modalLayer')closeModal();});
document.addEventListener('submit',onSubmit);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modalLayer').classList.contains('hidden'))closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.flashcard')){e.preventDefault();clickAction('flip-card',e.target);}});
const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.id='importInput';input.style.display='none';input.addEventListener('change',e=>importData(e.target.files[0]));document.body.appendChild(input);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker not registered:',err)));
setInterval(timerTick,800);
render();
</script>
